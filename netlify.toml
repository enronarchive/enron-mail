[[redirects]]
  from = "/mail/:mailbox/attachments/*"
  to = "https://huggingface.co/datasets/enronarchive/mail/resolve/main/mail/:mailbox/attachments/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/mail/:mailbox/index.json"
  to = "https://huggingface.co/datasets/enronarchive/mail/resolve/main/mail/:mailbox/index.json"
  status = 301
  force = true

[[redirects]]
  from = "/mail/:mailbox/index-part-:part.json"
  to = "https://huggingface.co/datasets/enronarchive/mail/resolve/main/mail/:mailbox/index-part-:part.json"
  status = 301
  force = true

# Optional: Add headers for better caching
[[headers]]
  for = "/mail/:mailbox/attachments/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mail/:mailbox/index.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mail/:mailbox/index-part-*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
